name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Core, validator, sync and ask-step tests (standard library only)
        run: python -m unittest discover -s tests -v

  r-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/llomics
          extra-packages: any::testthat, bioc::limma
      - name: Install the R package
        run: R CMD INSTALL r/llomics
      - name: R adapter tests
        run: Rscript -e 'testthat::test_local("r/llomics", stop_on_failure = TRUE)'
      - name: R and Python parity
        run: python -m unittest discover -s tests -p "test_parity.py" -v
