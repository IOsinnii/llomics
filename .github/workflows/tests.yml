name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Core, validator, sync, benchmark and ask-step tests (standard library only)
        run: python -m unittest discover -s tests -v

  r-core:
    # The R core, the limma adapter, and R-versus-Python parity. Seurat is not installed here,
    # so its tests are skipped and a problem with Seurat cannot hide a failure in the core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/llomics
          dependencies: '"hard"'
          extra-packages: any::testthat, bioc::limma
      - name: Install the R package
        run: R CMD INSTALL r/llomics
      - name: R tests (Seurat tests skip)
        run: Rscript -e 'testthat::test_local("r/llomics", stop_on_failure = TRUE)'
      - name: R and Python parity
        run: python -m unittest discover -s tests -p "test_parity.py" -v

  r-seurat:
    # The Seurat adapter, with Seurat and its large dependency tree installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/llomics
          dependencies: '"hard"'
          extra-packages: any::testthat, any::Seurat, any::SeuratObject
      - name: Install the R package
        run: R CMD INSTALL r/llomics
      - name: Check that Seurat loads
        run: Rscript -e 'library(Seurat); sessionInfo()'
      - name: R tests including Seurat
        run: Rscript -e 'testthat::test_local("r/llomics", stop_on_failure = TRUE)'
