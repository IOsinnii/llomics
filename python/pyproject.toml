[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llomics"
version = "0.1.0"
description = "Turn omics pipeline results into small, self-describing payloads for LLMs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
scanpy = ["scanpy>=1.10", "pandas", "numpy"]
bedrock = ["anthropic"]

[tool.setuptools]
packages = ["llomics"]
