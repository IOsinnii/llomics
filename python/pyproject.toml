[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llomics"
version = "0.1.0"
description = "Turn omics pipeline results into small, self-describing payloads for LLMs"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ivan Osinnii", email = "osenniy.ivan@gmail.com" }]
maintainers = [{ name = "Ivan Osinnii", email = "osenniy.ivan@gmail.com" }]
dependencies = []

[project.optional-dependencies]
scanpy = ["scanpy>=1.10", "pandas", "numpy"]
bedrock = ["anthropic"]

[tool.setuptools]
packages = ["llomics", "llomics.adapters"]

[tool.setuptools.package-data]
llomics = ["llomics-contract.json", "llomics-panels.json"]
